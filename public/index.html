<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório de Autenticação</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Laboratório de Autenticação</h1>
    
    <p id="status">A consultar sessão...</p>

    <div id="auth-actions">
      <a href="/oauth/login/google">Entrar com Google</a>
      <br><br>
      <a href="/oauth/login/github">Entrar com GitHub</a>
    </div>

    <form method="post" action="/oauth/logout" style="margin-top: 20px;">
      <button type="submit">Sair</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
