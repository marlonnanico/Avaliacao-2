<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Autenticação</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .card-header {
      margin-bottom: 28px;
    }

    .logo-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .status-badge {
      display: inline-block;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      word-break: break-all;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
    }

    .btn-google {
      background-color: #ffffff;
      color: #1f2937;
    }

    .btn-google:hover {
      background-color: #f3f4f6;
      transform: translateY(-1px);
    }

    .btn-github {
      background-color: #24292e;
      color: #ffffff;
      border: 1px solid #374151;
    }

    .btn-github:hover {
      background-color: #2c3137;
      transform: translateY(-1px);
    }

    .logout-form {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .btn-logout {
      background-color: transparent;
      color: #ef4444;
      border: 1px solid #ef444433;
    }

    .btn-logout:hover {
      background-color: #ef44441a;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="card-header">
      <div class="logo-icon">🔒</div>
      <h1>Laboratório de Autenticação</h1>
      <p id="status" class="status-badge">A consultar sessão...</p>
    </div>

    <div id="auth-actions" class="btn-group">
      <a href="/oauth/login/google" class="btn btn-google">
        <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v3.8h5.35c-.23 1.25-.94 2.31-2 3.06v2.54h3.24c1.89-1.74 2.98-4.3 2.98-7.4 0-.72-.07-1.42-.22-2.000Z"/><path fill="currentColor" d="M12 21c2.7 0 4.96-.89 6.62-2.42l-3.24-2.54c-.9.6-2.04.96-3.38.96-2.6 0-4.81-1.76-5.59-4.12H3.06v2.6C4.7 18.57 8.08 21 12 21z"/><path fill="currentColor" d="M6.41 12.88c-.2-.6-.31-1.24-.31-1.88s.11-1.28.31-1.88V6.52H3.06C2.38 7.88 2 9.4 2 11s.38 3.12 1.06 4.48l3.35-2.6z"/><path fill="currentColor" d="M12 4.96c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.95 1.94 14.7 1 12 1 8.08 1 4.7 3.43 3.06 6.52l3.35 2.6c.78-2.36 2.99-4.12 5.59-4.12z"/></svg>
        Entrar com Google
      </a>

      <a href="/oauth/login/github" class="btn btn-github">
        <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
        Entrar com GitHub
      </a>
    </div>

    <form method="post" action="/oauth/logout" class="logout-form">
      <button type="submit" class="btn btn-logout">Sair da Conta</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
